name: GitHub Actions Build and Deploy
on:
  push:
    branches:
      - main

# 1. 🌟 核心修复：添加明确的写入权限
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4 # 升级到最新版本

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4 # 升级到最新版本
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install and Build 🔨
        run: |
          pnpm install
          pnpm run build

      # 2. 🌟 核心修复：更新部署 Action 到 v4 并简化 Token 设置
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 使用自动生成的令牌，无需在 Settings 里手动创建 secret
          token: ${{ secrets.GITHUB_TOKEN }} 
          branch: gh-pages
          folder: dist
          clean: true
